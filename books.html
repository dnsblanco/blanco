<!doctype html>
<html>
	<head>

	<title>Books I've Read - Dennis Blanco</title>
	<meta charset="UTF-8" />
	<meta name="description" content="Books Dennis Blanco has read." />
	<meta name="viewport" content="width=device-width" />
	<meta name="robots" content="FOLLOW,INDEX, NOODP" />
	<meta property="og:title" content="Books I've Read - Dennis Blanco" />
	<meta property="og:url" content="http://dennisblanco.com/books.html" />
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥭</text></svg>" />
	<link rel="stylesheet" type="text/css" media="all" href="style.css" />

	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-112748717-1"></script>
	<script>
  		window.dataLayer = window.dataLayer || [];
  		function gtag(){dataLayer.push(arguments);}
  		gtag('js', new Date());

  		gtag('config', 'UA-112748717-1');
	</script>

	</head>

	<body>
		<div class="container">
			<p><a href="index.html">Dennis Blanco</a></p>
			<h1>Books I've Read</h1>
			<div id="books"><p>Loading…</p></div>
		</div>

		<script>
			// Books live in a Google Sheet with Title, Author, Month and Year columns.
			// The sheet must be shared as "Anyone with the link can view".
			var SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1oSLrcuF6Eo_Psr_qRdm_vwgqTQ3bHdApcGMbHJu8urg/gviz/tq?tqx=out:csv&gid=0';

			function parseCSV(text) {
				var rows = [], row = [], field = '', inQuotes = false;
				for (var i = 0; i < text.length; i++) {
					var c = text[i];
					if (inQuotes) {
						if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
						else if (c === '"') inQuotes = false;
						else field += c;
					} else if (c === '"') inQuotes = true;
					else if (c === ',') { row.push(field); field = ''; }
					else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
					else if (c !== '\r') field += c;
				}
				if (field || row.length) { row.push(field); rows.push(row); }
				return rows;
			}

			// Accepts full dates ("3/14/2025", "2025-03-14") or just a year ("2025").
			function parseDate(value) {
				value = value.trim();
				if (!/\d{4}/.test(value)) return null;
				if (/^\d{4}$/.test(value)) return new Date(Number(value), 0, 1);
				var iso = value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
				if (iso) return new Date(Number(iso[1]), iso[2] - 1, Number(iso[3]));
				var d = new Date(value);
				return isNaN(d) ? null : d;
			}

			function renderBooks(rows) {
				var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
				var col = function (names) {
					return header.findIndex(function (h) { return names.indexOf(h) !== -1; });
				};
				var titleCol = col(['title', 'book']);
				var authorCol = col(['author']);
				var dateCol = col(['date', 'date read', 'date finished', 'finished', 'year']);
				var monthCol = col(['month']);

				var books = rows.slice(1).map(function (r) {
					return { title: (r[titleCol] || '').trim(), author: (r[authorCol] || '').trim(), date: parseDate(monthCol !== -1 ? (r[monthCol] || '') + ' 1, ' + (r[dateCol] || '') : (r[dateCol] || '')) };
				}).filter(function (b) { return b.title && b.date; });

				// Books from the same month keep their order from the sheet.
				books.sort(function (a, b) { return b.date - a.date; });

				var container = document.getElementById('books');
				container.innerHTML = '';
				var list, year;
				books.forEach(function (b) {
					if (b.date.getFullYear() !== year) {
						year = b.date.getFullYear();
						var h2 = document.createElement('h2');
						h2.textContent = year;
						list = document.createElement('ul');
						container.appendChild(h2);
						container.appendChild(list);
					}
					var li = document.createElement('li');
					var em = document.createElement('em');
					em.textContent = b.title;
					li.appendChild(em);
					if (b.author) li.appendChild(document.createTextNode(' by ' + b.author));
					list.appendChild(li);
				});
			}

			fetch(SHEET_CSV)
				.then(function (res) { if (!res.ok) throw new Error(res.status); return res.text(); })
				.then(function (text) { renderBooks(parseCSV(text)); })
				.catch(function () {
					document.getElementById('books').innerHTML = '<p>Couldn\'t load the book list.</p>';
				});
		</script>
	</body>
</html>
